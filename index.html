<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunny Strike</title>
    <!-- ВСТАВЬ СКЛЕЕННЫЕ ССЫЛКИ СЮДА -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #4ea1d3; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
// ... (начало кода, стили и звук без изменений) ...

function spawn() {
    if (isBossActive) return;

    // УРОВЕНЬ 2: Снежная Лавина (после 400 очков и смерти 1-го босса)
    if (score >= 400 && bossSpawned && level === 1) { 
        level = 2; 
        levelText.setText('Уровень: 2 (Снега)'); 
        this.cameras.main.setBackgroundColor('#a2d2ff'); // Смена обстановки
    }

    // Условие появления 2-го БОССА (например, на 800 очках)
    if (score >= 800 && bossSpawned === 1) { 
        spawnBoss2.call(this); 
        return; 
    }
    
    if (score >= 400 && !bossSpawned) { spawnBoss.call(this); return; }
    
    let x = Phaser.Math.Between(40, config.width - 40);
    let type = (level === 2) ? 'cloud2' : 'cloud1';
    let c = clouds.create(x, -50, type);
    c.hp = (level === 2) ? 2 : 1;
    c.setVelocityY(200 + (level * 20));
}

// ЗВУК СМЕРТИ ОБЛАКА
function hitEnemy(bullet, enemy) {
    bullet.destroy(); enemy.hp--;
    if (enemy.hp <= 0) {
        // "Лопающийся" звук (высокий и короткий)
        playSound(600, 'sine', 0.08, 0.2); 
        
        if (Math.random() > 0.9) bonuses.create(enemy.x, enemy.y, 'bonus').setVelocityY(100);
        enemy.destroy(); 
        score += 10; 
        scoreText.setText('Очки: ' + score);
    }
}

// ФУНКЦИЯ ЗАВЕРШЕНИЯ И ПЕРЕДАЧИ ДАННЫХ
function resetGame() {
    // ПЕРЕДАЧА ДАННЫХ В БОТА
    if (window.Telegram && window.Telegram.WebApp) {
        // Отправляем счет строкой. ВАЖНО: закроет Mini App автоматически.
        Telegram.WebApp.sendData(score.toString());
    }

    // Локальный ресет (если sendData не сработал или играем в браузере)
    score = 0; lives = 3; level = 1; weaponLevel = 1; 
    isBossActive = false; bossSpawned = false;
    this.scene.restart();
}

// БОСС №2: Снежная Лавина
function spawnBoss2() {
    isBossActive = true; 
    bossSpawned = 2; // Метка, что второй босс в игре
    levelText.setText('БОСС: ЛАВИНА');
    
    boss = this.physics.add.sprite(config.width/2, -100, 'boss1'); 
    boss.setTint(0xffffff); // Белый босс
    boss.maxHp = 50; boss.hp = 50;
    
    this.tweens.add({ targets: boss, y: 150, duration: 2000, ease: 'Back.easeOut' });

    // Спец-эффект Лавины: замедление игрока
    this.time.addEvent({
        delay: 2000,
        callback: () => {
            if (isBossActive) {
                this.cameras.main.flash(500, 255, 255, 255);
                // Тут можно добавить летящие снежки
            }
        },
        loop: true
    });

    this.physics.add.overlap(bullets, boss, (bObj, bullet) => {
        bullet.destroy(); bObj.hp--; playSound(100, 'sawtooth', 0.05);
        if (bObj.hp <= 0) {
            bObj.destroy(); isBossActive = false; score += 1000;
            levelText.setText('Уровень 2 ПРОЙДЕН!');
            this.cameras.main.setBackgroundColor('#6a4c93'); // Смена фона на 3 уровень
        }
    });
}

    </script>
</body>
</html>
