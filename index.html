<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunny Strike</title>
    <!-- Используем зеркало библиотеки для надежности -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #4ea1d3; touch-action: none; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
    // Проверка Telegram SDK
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        backgroundColor: '#4ea1d3',
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: { preload, create, update }
    };

    let player, bullets, clouds, score = 0, scoreText;

    function preload() {
        // Создаем текстуры программно (без внешних картинок)
        let graphics = this.make.graphics({ x: 0, y: 0, add: false });
        
        graphics.fillStyle(0xffff00, 1);
        graphics.fillCircle(16, 16, 16);
        graphics.generateTexture('sun', 32, 32);
        graphics.clear();

        graphics.fillStyle(0xffffff, 1);
        graphics.fillRect(0, 0, 4, 12);
        graphics.generateTexture('bullet', 4, 12);
        graphics.clear();

        graphics.fillStyle(0xeeeeee, 1);
        graphics.fillEllipse(20, 15, 40, 30);
        graphics.generateTexture('cloud', 40, 30);
    }

    function create() {
        player = this.physics.add.sprite(window.innerWidth / 2, window.innerHeight - 100, 'sun');
        player.setCollideWorldBounds(true);

        bullets = this.physics.add.group();
        clouds = this.physics.add.group();

        // Автострельба
        this.time.addEvent({
            delay: 400,
            callback: () => {
                let b = bullets.create(player.x, player.y - 20, 'bullet');
                if (b) b.setVelocityY(-400);
            },
            loop: true
        });

        // Спавн тучек
        this.time.addEvent({
            delay: 1000,
            callback: () => {
                let x = Phaser.Math.Between(40, window.innerWidth - 40);
                let c = clouds.create(x, -50, 'cloud');
                if (c) c.setVelocityY(150 + (score / 10));
            },
            loop: true
        });

        scoreText = this.add.text(20, 40, 'Score: 0', { 
            fontSize: '24px', fill: '#fff', fontWeight: 'bold' 
        });

        // Коллизии
        this.physics.add.overlap(bullets, clouds, (bullet, cloud) => {
            bullet.destroy();
            cloud.destroy();
            score += 10;
            scoreText.setText('Score: ' + score);
        });

        this.physics.add.overlap(player, clouds, () => {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            score = 0;
            this.scene.restart();
        });

        // Управление
        this.input.on('pointermove', (p) => {
            player.x = p.x;
            player.y = p.y - 50;
        });
    }

    function update() {
        bullets.children.iterate(b => { if (b && b.y < -20) b.destroy(); });
        clouds.children.iterate(c => { if (c && c.y > window.innerHeight + 50) c.destroy(); });
    }

    // Запуск
    try {
        new Phaser.Game(config);
    } catch (e) {
        alert("Ошибка запуска игры: " + e.message);
    }
    </script>
</body>
</html>
