<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunny Strike</title>
    <!-- ВСТАВЬ СКЛЕЕННЫЕ ССЫЛКИ СЮДА -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #4ea1d3; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
    // Проверка, что библиотеки загрузились
    window.onload = function() {
        if (typeof Phaser === 'undefined') {
            alert("Библиотека Phaser не загружена! Проверь первую ссылку.");
            return;
        }

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);
        let player, bullets, clouds, score = 0, scoreText;

        function preload() {
            let g = this.make.graphics({ x: 0, y: 0, add: false });
            g.fillStyle(0xffff00, 1).fillCircle(16, 16, 16);
            g.generateTexture('sun', 32, 32); g.clear();
            g.fillStyle(0xffffff, 1).fillRect(0, 0, 4, 12);
            g.generateTexture('bullet', 4, 12); g.clear();
            g.fillStyle(0xeeeeee, 1).fillEllipse(20, 15, 40, 30);
            g.generateTexture('cloud', 40, 30);
        }

        function create() {
            player = this.physics.add.sprite(config.width/2, config.height-100, 'sun').setCollideWorldBounds(true);
            bullets = this.physics.add.group();
            clouds = this.physics.add.group();
            scoreText = this.add.text(20, 40, 'Score: 0', { fontSize: '24px', fill: '#fff' });

            this.time.addEvent({
                delay: 400, callback: () => {
                    let b = bullets.create(player.x, player.y - 20, 'bullet');
                    if (b) b.setVelocityY(-400);
                }, loop: true
            });

            this.time.addEvent({
                delay: 1000, callback: () => {
                    let x = Phaser.Math.Between(40, config.width - 40);
                    let c = clouds.create(x, -50, 'cloud');
                    if (c) c.setVelocityY(150);
                }, loop: true
            });

            this.physics.add.overlap(bullets, clouds, (b, c) => { b.destroy(); c.destroy(); score += 10; scoreText.setText('Score: ' + score); });
            this.physics.add.overlap(player, clouds, () => { if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy'); location.reload(); });

            this.input.on('pointermove', (p) => { if (p.isDown) { player.x = p.x; player.y = p.y - 60; } });
        }

        function update() {
            bullets.children.iterate(b => { if (b && b.y < -20) b.destroy(); });
            clouds.children.iterate(c => { if (c && c.y > config.height + 50) c.destroy(); });
        }
    }
    </script>
</body>
</html>
