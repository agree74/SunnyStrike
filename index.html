<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sunny Strike</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: var(--font); overscroll-behavior: none; }
  #game-container { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .gbtn { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; justify-content: center;
    color: #fff; font: 600 14px var(--font); height: 38px; min-width: 38px; padding: 0 14px; box-sizing: border-box; cursor: pointer;
    background: rgba(8, 22, 43, .48); border: 1px solid rgba(255,255,255,.28); border-radius: 19px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); touch-action: manipulation; }
  .gbtn:active { transform: scale(.94); }
  #btnMute { left: 12px; padding: 0; width: 38px; }
  #btnExit { right: 12px; }
  #btnMute svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #dlg { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
  #dlg.show { display: flex; }
  #dlg .card { width: min(82vw, 320px); padding: 22px 20px 18px; border-radius: 20px; text-align: center; color: #fff;
    background: linear-gradient(160deg, rgba(30,50,90,.96), rgba(12,20,40,.96)); border: 1px solid rgba(255,255,255,.22); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #dlg h3 { margin: 0 0 8px; font: 700 20px var(--font); }
  #dlg p { margin: 0 0 18px; font: 400 14px/1.4 var(--font); opacity: .8; }
  #dlg .row { display: flex; gap: 10px; }
  #dlg button { flex: 1; height: 44px; border-radius: 14px; border: 0; font: 700 15px var(--font); color: #fff; cursor: pointer; touch-action: manipulation; }
  #dlgNo { background: linear-gradient(180deg, #ffb52e, #ff8a00); }
  #dlgYes { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25) !important; }

  #rot { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; text-align: center;
    background: #0a1426; color: #fff; font: 600 18px var(--font); padding: 24px; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display: flex; } }
</style>
</head>
<body>

<div id="dlg"><div class="card">
  <h3>Выйти из игры?</h3>
  <p>Текущий счёт будет отправлен в бот.</p>
  <div class="row"><button id="dlgNo">Продолжить</button><button id="dlgYes">Выйти</button></div>
</div></div>

<div id="rot">Поверните телефон вертикально<br>☀️</div>

<script>
(function () {
'use strict';

// ============================================================================
// TELEGRAM (с заглушкой, чтобы игру можно было открыть и в обычном браузере)
// ============================================================================
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : {
  ready() {}, expand() {}, close() { console.log('[tg.close]'); },
  sendData(d) { console.log('[tg.sendData]', d); }, HapticFeedback: null
};
try { tg.ready(); tg.expand(); } catch (e) {}
try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
try { if (tg.lockOrientation) tg.lockOrientation(); } catch (e) {}
try { if (tg.setHeaderColor) tg.setHeaderColor('#000000'); } catch (e) {}

let lastHap = 0;
function hap(kind, style) {
  const n = Date.now(); if (n - lastHap < 70) return; lastHap = n;
  try { const h = tg.HapticFeedback; if (h && h[kind]) h[kind](style); } catch (e) {}
}

// ============================================================================
// CONFIG — все числа и правила игры собраны здесь
// ============================================================================
const CFG = {
  START_LIVES: 3, MAX_LIVES: 5,
  FIRE_MS: 300, SPAWN_MS: 1000, BOSS_MS: 20000, BOSS_INTRO_MS: 2000, POST_BOSS_PAUSE_MS: 3000,
  BULLET_SPEED: 600, BULLET_SPACING: 15, GREEN_MS: 7000, GREEN_SPREAD: 60,
  DROP_CHANCE: 0.2, BONUS_FALL: 80,
  SCORE_KILL: 10, SCORE_BOSS: 1000, SCORE_HEART_FULL: 50,
  BOSS_MIN_HP: [0, 65, 130, 220, 340, 500],
  BOSS_VOLLEYS: [0, 26, 31, 36, 41, 46], // целевое число залпов для адаптивного ХП
  SPEED_GROWTH: 1.1,
  LEVELS: {
    1: { name: 'Голубое небо',   enemy: 'cloud1',  enemyName: 'Злое Облако',     enemyHp: 1, speed: 200, color: '#4ea1d3',
         bg: [[0, '#9fdcf7'], [1, '#4ea1d3']],                    boss: 'Взрывной ураган', bossTint: 0xffe14a, cloudTint: 0xffffff, stars: 0,   glow: [0xffffff, 0.28] },
    2: { name: 'Грозовой фронт', enemy: 'cloud2',  enemyName: 'Грозовая туча',   enemyHp: 2, speed: 250, color: '#2c5f7f',
         bg: [[0, '#16293a'], [1, '#2c5f7f']],                    boss: 'Штормовой Вихрь', bossTint: 0xa8c4e0, cloudTint: 0xaebdcc, stars: 0,   glow: [0x6a8aa8, 0.25] },
    3: { name: 'Закат',          enemy: 'cloud3',  enemyName: 'Перистые облака', enemyHp: 3, speed: 300, color: '#ff6b35',
         bg: [[0, '#4d2f6e'], [0.55, '#ff6b35'], [1, '#ffc468']], boss: 'Затмение',        bossTint: 0xff8a2a, cloudTint: 0xffd5b5, stars: 0,   glow: [0xffa040, 0.55] },
    4: { name: 'Стратосфера',    enemy: 'crystal', enemyName: 'Кристалл холода', enemyHp: 6, speed: 400, color: '#3a3a5e',
         bg: [[0, '#0f0f24'], [1, '#4a4a78']],                    boss: 'Ледяной Гигант',  bossTint: 0x9fe8ff, cloudTint: 0xc8c8ff, stars: 0.6, glow: [0x6a5acd, 0.3] },
    5: { name: 'Орбита',         enemy: 'debris',  enemyName: 'Техно-мусор',     enemyHp: 8, speed: 500, color: '#1a1a1a',
         bg: [[0, '#020208'], [0.7, '#15101f'], [1, '#2b1740']],  boss: 'Чёрная Дыра',     bossTint: 0xff55ff, cloudTint: 0x9090b0, stars: 1,   glow: [0x8a22b8, 0.4] }
  },
  SIZES: { cloud1: [80, 60], cloud2: [80, 75], cloud3: [100, 50], crystal: [70, 70], debris: [70, 70] }
};
const baseBpm = (lv) => 108 + lv * 6;

// ============================================================================
// УТИЛИТЫ
// ============================================================================
const TAU = Math.PI * 2;
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
const rnd = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const ov = (a, b) => Math.abs(a.x - b.x) < a.hw + b.hw && Math.abs(a.y - b.y) < a.hh + b.hh;

let sent = false;
let sceneRef = null;

const LW = Math.max(window.innerWidth, 200);
const LH = Math.max(window.innerHeight, 300);
const D = Math.min(window.devicePixelRatio || 1, 2);
const SAFE_TOP = Math.max(0, ((tg.safeAreaInset && tg.safeAreaInset.top) || 0) + ((tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0));
const TOP = 10 + SAFE_TOP;
const TS = 2; // масштаб процедурных текстур

// ============================================================================
// ПЕРЕДАЧА ОЧКОВ В ТЕЛЕГРАМ
// ============================================================================
function sendScoreAndClose() {
  if (sent) return; sent = true;
  const score = sceneRef ? sceneRef.score : 0;
  try { if (tg.sendData) tg.sendData(String(score)); } catch (e) {}
  setTimeout(() => { try { tg.close(); } catch (e) {} }, 1000);
}

// ============================================================================
// ЗВУКОВОЙ ДВИЖОК (WebAudio, без файлов)
// ============================================================================
const Aud = {
  ctx: null, master: null, sfx: null, mus: null, rev: null, dist: null, nbuf: null,
  muted: lsGet('ss_mute') === '1',
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 18; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = 0.42; this.mus.connect(this.master);
    // реверб
    const len = (c.sampleRate * 1.4) | 0, ib = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ib.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const cv = c.createConvolver(); cv.buffer = ib;
    this.rev = c.createGain(); this.rev.gain.value = 0.35; this.rev.connect(cv);
    const rg = c.createGain(); rg.gain.value = 0.55; cv.connect(rg); rg.connect(this.master);
    // дисторшн
    this.dist = c.createWaveShaper();
    const cur = new Float32Array(512);
    for (let i = 0; i < 512; i++) { const x = i / 256 - 1; cur[i] = ((3 + 40) * x * 20 * (Math.PI / 180)) / (Math.PI + 40 * Math.abs(x)); }
    this.dist.curve = cur; this.dist.connect(this.sfx);
    // шум
    this.nbuf = c.createBuffer(1, c.sampleRate * 3, c.sampleRate);
    const nd = this.nbuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  },
  setMuted(m) {
    this.muted = m; lsSet('ss_mute', m ? '1' : '0');
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.03);
  },
  play(name) { if (!this.ctx || this.muted || this.ctx.state !== 'running') return; try { const f = SFX[name]; if (f) f(); } catch (e) {} }
};

function T(o) {
  const c = Aud.ctx; if (!c) return;
  const t = o.t || c.currentTime, v = o.v == null ? 0.1 : o.v, a = o.a == null ? 0.005 : o.a;
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + o.d);
  if (o.det) osc.detune.value = o.det;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
  let out = osc;
  if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); out = f; }
  out.connect(g);
  g.connect(o.dist ? Aud.dist : (o.bus || Aud.sfx));
  if (o.rev) g.connect(Aud.rev);
  osc.start(t); osc.stop(t + o.d + 0.05);
}
function N(o) {
  const c = Aud.ctx; if (!c || !Aud.nbuf) return;
  const t = o.t || c.currentTime, v = o.v == null ? 0.1 : o.v;
  const s = c.createBufferSource(); s.buffer = Aud.nbuf; s.loop = true;
  const f = c.createBiquadFilter(); f.type = o.type || 'lowpass';
  f.frequency.setValueAtTime(o.f || 1000, t);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.d);
  f.Q.value = o.q || 0.7;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + (o.a || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
  s.connect(f); f.connect(g); g.connect(o.bus || Aud.sfx);
  s.start(t, Math.random()); s.stop(t + o.d + 0.05);
}
const arp = (notes, gap, type, v, rev) => {
  const t0 = Aud.ctx.currentTime;
  notes.forEach((f, i) => T({ f, d: 0.24, type, v, t: t0 + i * gap, rev }));
};

const SFX = {
  shoot() { const f = 640 + Math.random() * 120; T({ f, f2: 150, d: 0.1, type: 'triangle', v: 0.05 }); T({ f: f * 1.9, f2: 300, d: 0.05, type: 'square', v: 0.012 }); },
  hit() { N({ d: 0.06, type: 'bandpass', f: 1700, q: 1.2, v: 0.07 }); T({ f: 340, f2: 110, d: 0.09, type: 'sine', v: 0.08 }); },
  enemy_death() { N({ d: 0.28, type: 'lowpass', f: 2600, f2: 200, v: 0.14 }); T({ f: 240, f2: 55, d: 0.26, type: 'triangle', v: 0.13 }); T({ f: 900, f2: 300, d: 0.1, type: 'square', v: 0.02 }); },
  boss_shot() { T({ f: 310, f2: 110, d: 0.18, type: 'sawtooth', v: 0.045, lp: 1200 }); N({ d: 0.1, type: 'bandpass', f: 1100, q: 1.4, v: 0.04 }); },
  pow_green() { arp([523, 659, 784, 1047, 1319], 0.05, 'triangle', 0.07, 1); },
  pow_yellow() { arp([440, 554, 659, 880], 0.055, 'square', 0.04, 1); },
  pow_purple() { arp([330, 415, 494, 659, 988], 0.05, 'sawtooth', 0.035, 1); T({ f: 110, f2: 220, d: 0.3, type: 'sine', v: 0.1 }); },
  pow_heart() { arp([523, 659, 784, 1047], 0.08, 'sine', 0.09, 1); },
  hurt() {
    const t0 = Aud.ctx.currentTime;
    T({ f: 260, f2: 40, d: 0.55, type: 'sawtooth', v: 0.14, lp: 900, rev: 1 });
    N({ d: 0.35, type: 'lowpass', f: 1800, f2: 150, v: 0.16 });
    [523, 440, 349, 261].forEach((f, i) => T({ f, f2: f - 40, d: 0.14, type: 'square', v: 0.04, t: t0 + i * 0.09 }));
  },
  warn() { const t0 = Aud.ctx.currentTime; T({ f: 880, d: 0.12, type: 'square', v: 0.045 }); T({ f: 880, d: 0.12, type: 'square', v: 0.045, t: t0 + 0.22 }); T({ f: 660, d: 0.3, type: 'square', v: 0.045, t: t0 + 0.44 }); },
  boss_appear() {
    const t0 = Aud.ctx.currentTime;
    T({ f: 60, f2: 420, d: 1.8, type: 'sawtooth', v: 0.09, lp: 1400, rev: 1 });
    N({ d: 1.8, type: 'bandpass', f: 200, f2: 3000, q: 1.5, v: 0.09, a: 0.5 });
    T({ f: 120, f2: 30, d: 0.6, type: 'sine', v: 0.25, t: t0 + 1.8 });
  },
  boss_win() {
    const t0 = Aud.ctx.currentTime;
    [523, 659, 784, 1046, 784, 1046, 1319].forEach((f, i) => {
      T({ f, d: 0.35, type: 'square', v: 0.05, t: t0 + i * 0.1, rev: 1 });
      T({ f: f / 2, d: 0.35, type: 'triangle', v: 0.07, t: t0 + i * 0.1 });
    });
    N({ d: 0.5, type: 'highpass', f: 5000, v: 0.05 });
  },
  boss5_win() {
    const t0 = Aud.ctx.currentTime;
    [523, 523, 523, 698].forEach((f, i) => T({ f, d: 0.6, type: 'sawtooth', v: 0.06, t: t0 + i * 0.15, lp: 2400, rev: 1 }));
    T({ f: 1046, d: 1.4, type: 'sawtooth', v: 0.05, t: t0 + 0.6, lp: 3000, rev: 1 });
    T({ f: 130, f2: 40, d: 1.2, type: 'sine', v: 0.2, t: t0 });
  },
  game_over() {
    const t0 = Aud.ctx.currentTime;
    [392, 370, 349, 294].forEach((f, i) => T({ f, f2: f - 12, d: 1.0, type: 'sawtooth', v: 0.07, t: t0 + i * 0.5, lp: 1400, rev: 1 }));
    T({ f: 98, f2: 60, d: 2.2, type: 'sine', v: 0.18, t: t0 });
  },
  evil_triumph() {
    const t0 = Aud.ctx.currentTime;
    [110, 103, 98, 82].forEach((f, i) => {
      T({ f, d: 1.6, type: 'sawtooth', v: 0.07, t: t0 + i * 0.8, dist: true });
      T({ f: f * 1.005, d: 1.6, type: 'sawtooth', v: 0.05, t: t0 + i * 0.8, dist: true, det: 12 });
    });
    N({ d: 4, type: 'lowpass', f: 300, f2: 120, v: 0.18, a: 1.2 });
    T({ f: 41, d: 4.5, type: 'sine', v: 0.25, a: 0.8 });
  }
};

// ---------- Музыка: процедурный секвенсор ----------
const hz = (s) => 110 * Math.pow(2, s / 12);
const ROOTS = [0, -4, 3, -2];             // Am F C G
const TRI_MAJ = [0, 4, 7], TRI_MIN = [0, 3, 7];
const LEAD_PLAY = [
  [3, -1, -1, 5, -1, 4, -1, 5, 3, -1, -1, -1, 4, -1, 5, -1],
  [3, -1, -1, -1, 5, -1, 4, -1, 2, -1, 3, -1, -1, -1, -1, -1]
];
const LEAD_BOSS = [
  [5, -1, 5, 4, -1, 3, 4, -1, 5, -1, 5, 6, -1, 5, 4, -1],
  [3, -1, 4, 5, -1, 4, 3, -1, 2, -1, 3, 4, -1, 3, 2, -1]
];
const Music = {
  mode: null, step: 0, next: 0, timer: null, bpm: 112,
  set(mode, bpm) { this.mode = mode; if (bpm) this.bpm = bpm; this.kick(); },
  kick() {
    if (!Aud.ctx || this.timer || !this.mode) return;
    this.step = 0; this.next = Aud.ctx.currentTime + 0.08;
    this.timer = setInterval(() => this.tick(), 30);
  },
  stop() { this.mode = null; if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  tick() {
    const c = Aud.ctx; if (!c || c.state !== 'running' || !this.mode) return;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.15) {
      try { this.play(this.step, this.next); } catch (e) {}
      this.next += 60 / this.bpm / 4; this.step++;
    }
  },
  play(st, t) {
    const bar = (st >> 4) & 3, s = st & 15, root = ROOTS[bar], m = this.mode, bus = Aud.mus;
    const ch = (m === 'play' && bar !== 0) ? TRI_MAJ : TRI_MIN;
    const note = (deg, oct) => hz(root + ch[((deg % 3) + 3) % 3] + 12 * Math.floor(deg / 3) + oct);
    const kick = (v) => T({ f: 150, f2: 42, d: 0.2, type: 'sine', v, t, bus });
    const hat = (v) => N({ d: 0.04, type: 'highpass', f: 7000, v, t, bus });
    const snare = (v) => { N({ d: 0.13, type: 'bandpass', f: 1800, q: 0.8, v, t, bus }); T({ f: 220, f2: 110, d: 0.09, type: 'triangle', v: v * 0.6, t, bus }); };
    if (m === 'play') {
      if (s % 4 === 0) kick(0.45);
      if (s % 4 === 2) hat(0.04);
      if (s === 4 || s === 12) snare(0.07);
      if (s % 2 === 0) T({ f: hz(root), d: 0.2, type: 'triangle', v: 0.17, t, lp: 700, bus });
      T({ f: note([0, 1, 2, 1][s % 4], 24), d: 0.11, type: 'square', v: 0.018, t, lp: 3200, bus, rev: 1 });
      const d = LEAD_PLAY[bar & 1][s];
      if (d >= 0) T({ f: note(d, 24), d: 0.3, type: 'triangle', v: 0.06, t, bus, rev: 1 });
    } else if (m === 'boss') {
      if (s % 4 === 0 || s === 14) kick(0.55);
      if (s === 4 || s === 12) snare(0.11);
      if (s % 2 === 0) hat(0.05);
      T({ f: hz(root) * (s % 4 === 2 ? 2 : 1), d: 0.11, type: 'sawtooth', v: 0.1, t, lp: 520, bus });
      T({ f: note([0, 2, 1, 2][s % 4], 24), d: 0.1, type: 'sawtooth', v: 0.02, t, lp: 2600, bus });
      const d = LEAD_BOSS[bar & 1][s];
      if (d >= 0) T({ f: note(d, 24), d: 0.22, type: 'sawtooth', v: 0.045, t, lp: 3000, bus, rev: 1 });
    } else if (m === 'dark') {
      const barLen = 60 / this.bpm * 4;
      if (s === 0) {
        [0, 7, 12].forEach((o, i) => T({ f: hz(root - 12 + o), d: barLen * 1.1, type: 'sawtooth', v: 0.06, t, a: 0.6, lp: 500 + i * 100, bus, rev: 1 }));
        T({ f: hz(root - 24), d: barLen, type: 'sine', v: 0.2, t, a: 0.3, bus });
      }
      if (s === 8) T({ f: note(5 + (bar % 2), 36), d: 1.4, type: 'sine', v: 0.05, t, bus, rev: 1 });
      if (s % 8 === 0 && bar % 2 === 1) kick(0.3);
    }
  }
};

// ============================================================================
// ПРОЦЕДУРНЫЕ ТЕКСТУРЫ (Canvas 2D)
// ============================================================================
function mk(scene, key, w, h, fn, s) {
  s = s || TS;
  if (scene.textures.exists(key)) scene.textures.remove(key);
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * s); c.height = Math.ceil(h * s);
  const x = c.getContext('2d'); x.scale(s, s); fn(x, w, h);
  scene.textures.addCanvas(key, c);
}
const RG = (x, cx, cy, r0, r1, st) => { const g = x.createRadialGradient(cx, cy, r0, cx, cy, r1); for (const s of st) g.addColorStop(s[0], s[1]); return g; };
const LG = (x, x0, y0, x1, y1, st) => { const g = x.createLinearGradient(x0, y0, x1, y1); for (const s of st) g.addColorStop(s[0], s[1]); return g; };
const disc = (x, cx, cy, r, f) => { x.fillStyle = f; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); };
const ell = (x, cx, cy, rx, ry, f, rot) => { x.fillStyle = f; x.beginPath(); x.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU); x.fill(); };
const glowDot = (x, cx, cy, r, rgb, a) => { x.fillStyle = RG(x, cx, cy, 0, r, [[0, `rgba(${rgb},${a == null ? 1 : a})`], [1, `rgba(${rgb},0)`]]); x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); };
const line = (x, pts, w, col, close) => { x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); if (close) x.closePath(); x.stroke(); };
const poly = (x, pts, f) => { x.fillStyle = f; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill(); };
const eye = (x, cx, cy, rx, ry, iris, pup, glow) => {
  if (glow) glowDot(x, cx, cy, Math.max(rx, ry) * 2.3, glow, 0.55);
  ell(x, cx, cy, rx, ry, iris);
  disc(x, cx + rx * 0.12, cy + ry * 0.18, Math.min(rx, ry) * 0.52, pup);
  disc(x, cx - rx * 0.28, cy - ry * 0.3, Math.min(rx, ry) * 0.2, 'rgba(255,255,255,.9)');
};
const blobs = (x, list, f) => { x.fillStyle = f; for (const b of list) { x.beginPath(); x.arc(b[0], b[1], b[2], 0, TAU); x.fill(); } };
const heartPath = (x, cx, cy, s) => {
  x.beginPath(); x.moveTo(cx, cy + s * 0.9);
  x.bezierCurveTo(cx - s * 1.5, cy - s * 0.1, cx - s * 0.8, cy - s * 1.1, cx, cy - s * 0.35);
  x.bezierCurveTo(cx + s * 0.8, cy - s * 1.1, cx + s * 1.5, cy - s * 0.1, cx, cy + s * 0.9);
  x.closePath();
};

function sunBody(x, state) {
  glowDot(x, 40, 40, 34, '255,190,40', 0.3);
  disc(x, 40, 40, 24, RG(x, 33, 31, 2, 28, [[0, '#fffdc0'], [0.5, '#ffe14d'], [1, '#ffa91c']]));
  x.lineWidth = 1.4; x.strokeStyle = 'rgba(190,100,0,.65)'; x.beginPath(); x.arc(40, 40, 24, 0, TAU); x.stroke();
  disc(x, 26.5, 46, 4.2, 'rgba(255,100,90,.4)'); disc(x, 53.5, 46, 4.2, 'rgba(255,100,90,.4)');
  x.strokeStyle = '#5a3000'; x.lineWidth = 2.2; x.lineCap = 'round'; x.lineJoin = 'round';
  if (state === 'hurt') {
    x.beginPath(); x.moveTo(28, 32); x.lineTo(36, 36); x.lineTo(28, 40); x.moveTo(52, 32); x.lineTo(44, 36); x.lineTo(52, 40); x.stroke();
    x.beginPath(); x.moveTo(31, 54); x.quadraticCurveTo(35.5, 49, 40, 54); x.quadraticCurveTo(44.5, 59, 49, 54); x.stroke();
    disc(x, 59, 27, 2.6, 'rgba(120,200,255,.95)');
  } else {
    ell(x, 33, 36, 5.4, 6.2, '#fff'); ell(x, 47, 36, 5.4, 6.2, '#fff');
    x.lineWidth = 1; x.strokeStyle = 'rgba(120,70,0,.6)';
    x.beginPath(); x.ellipse(33, 36, 5.4, 6.2, 0, 0, TAU); x.stroke(); x.beginPath(); x.ellipse(47, 36, 5.4, 6.2, 0, 0, TAU); x.stroke();
    if (state === 'happy') {
      x.fillStyle = '#8a1f1f'; x.beginPath(); x.moveTo(29, 47); x.quadraticCurveTo(40, 66, 51, 47); x.closePath(); x.fill();
      disc(x, 40, 56, 3.6, '#ff7a8a');
    } else {
      x.lineWidth = 2.2; x.strokeStyle = '#5a3000'; x.beginPath(); x.arc(40, 45, 9, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke();
    }
  }
}

function drawBH(x, S) {
  x.save(); x.scale(S / 120, S / 120);
  glowDot(x, 60, 60, 60, '200,0,200', 0.5);
  const ring = (a0, a1) => {
    x.save(); x.translate(60, 60); x.rotate(-0.35); x.scale(1, 0.32);
    x.lineWidth = 8; x.strokeStyle = 'rgba(255,140,255,.85)'; x.beginPath(); x.arc(0, 0, 54, a0, a1); x.stroke();
    x.lineWidth = 3; x.strokeStyle = 'rgba(255,235,255,.85)'; x.beginPath(); x.arc(0, 0, 47, a0, a1); x.stroke();
    x.restore();
  };
  ring(0, TAU);
  disc(x, 60, 60, 42, '#000');
  x.lineWidth = 3; x.strokeStyle = '#cc00cc'; x.beginPath(); x.arc(60, 60, 42, 0, TAU); x.stroke();
  ring(0, Math.PI);
  eye(x, 46, 52, 9, 10, '#ff77ff', '#000', '255,80,255'); eye(x, 74, 52, 9, 10, '#ff77ff', '#000', '255,80,255');
  line(x, [[32, 38], [56, 43]], 4, '#ff77ff'); line(x, [[90, 33], [66, 43]], 4, '#ff77ff');
  x.strokeStyle = '#ff77ff'; x.lineWidth = 4.5; x.lineCap = 'round'; x.beginPath(); x.arc(66, 68, 22, 0.2 * Math.PI, 0.75 * Math.PI); x.stroke();
  x.restore();
}

function sphere(x, cx, cy, r, st, inner) {
  x.save(); x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.clip();
  disc(x, cx, cy, r, RG(x, cx - r * 0.35, cy - r * 0.4, r * 0.05, r * 1.25, st));
  if (inner) inner();
  disc(x, cx, cy, r, RG(x, cx - r * 0.45, cy - r * 0.5, r * 0.2, r * 1.45, [[0, 'rgba(255,255,255,.22)'], [0.45, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,20,.72)']]));
  x.restore();
  x.strokeStyle = 'rgba(190,225,255,.28)'; x.lineWidth = 1.5; x.beginPath(); x.arc(cx, cy, r - 0.5, 0, TAU); x.stroke();
}

  bonus('bonus_speed', '#fff59a', '#e0a800', '255,230,60', (x) => { const p = []; for (let i = 0; i < 10; i++) { const a = i / 10 * TAU - Math.PI / 2, r = i % 2 ? 6 : 14; p.push([25 + Math.cos(a) * r, 26 + Math.sin(a) * r]); } poly(x, p, '#fff'); });
  bonus('bonus_damage', '#f6a0ff', '#a010b8', '240,60,255', (x) => poly(x, [[25, 11], [35, 25], [29, 25], [29, 39], [21, 39], [21, 25], [15, 25]], '#fff'));
  bonus('bonus_heart', '#ff9a9a', '#d01020', '255,60,60', (x) => { heartPath(x, 25, 26, 10); x.fillStyle = '#fff'; x.fill(); });
  mk(sc, 'bonus_ring', 70, 70, (x) => { x.strokeStyle = 'rgba(255,255,255,.8)'; x.lineWidth = 2.5; x.beginPath(); x.arc(35, 35, 31, 0, TAU); x.stroke(); });

  mk(sc, 'heart_full', 28, 28, (x) => {

  });
  mk(sc, 'heart_empty', 28, 28, (x) => { heartPath(x, 14, 14, 9.5); x.fillStyle = 'rgba(0,0,0,.28)'; x.fill(); x.lineWidth = 1.5; x.strokeStyle = 'rgba(255,255,255,.35)'; x.stroke(); });

  for (let lv = 1; lv <= 5; lv++) mk(sc, 'bg' + lv, 4, 256, (x) => { x.fillStyle = LG(x, 0, 0, 0, 256, CFG.LEVELS[lv].bg); x.fillRect(0, 0, 4, 256); }, 1);
  mk(sc, 'cloud_bg', 100, 50, (x) => {
    [[30, 30, 18], [50, 24, 22], [72, 30, 18], [50, 34, 20], [38, 36, 15], [64, 36, 15]].forEach((b) => glowDot(x, b[0], b[1], b[2] * 1.15, '255,255,255', 0.85));
  });
  const starTile = (key, n, seed, rmin, rmax) => mk(sc, key, 256, 256, (x) => {

  // ---- Планеты ----
  mk(sc, 'planet1', 120, 120, (x) => sphere(x, 60, 60, 46, [[0, '#ffb08a'], [0.55, '#c4683e'], [1, '#4e1f0e']], () => {

  }));

  }));
  mk(sc, 'planet3', 120, 120, (x) => sphere(x, 60, 60, 46, [[0, '#7cbcff'], [0.55, '#2a6fd4'], [1, '#0b2c6b']], () => {
    blobs(x, [[46, 48, 14], [38, 58, 9], [54, 62, 8], [82, 66, 13], [90, 52, 7], [76, 78, 7]], '#4fa84a');
    blobs(x, [[50, 46, 6], [84, 64, 5]], '#8bc34a');
    ell(x, 60, 18, 24, 7, '#fff'); ell(x, 60, 104, 22, 6, '#fff');
    for (let i = 0; i < 5; i++) ell(x, 40 + i * 12, 38 + (i % 3) * 18, 16, 3.5, 'rgba(255,255,255,.55)', 0.2 * (i % 2 ? 1 : -1));
  }));
  mk(sc, 'planet4', 120, 120, (x) => sphere(x, 60, 60, 47, [[0, '#a8ffa8'], [0.55, '#44aa44'], [1, '#063a06']], () => {
    const cols = ['rgba(120,230,120,.5)', 'rgba(30,110,30,.45)', 'rgba(200,255,190,.35)', 'rgba(10,80,10,.45)'];
    for (let i = 0; i < 9; i++) ell(x, 60, 18 + i * 10, 56, 4.5 + (i % 2) * 2, cols[i % 4]);
    ell(x, 78, 74, 9, 5.5, 'rgba(220,255,210,.65)');

  mk(sc, 'planet5', 120, 120, (x) => {
    const ring = (a0, a1) => { x.save(); x.translate(60, 60); x.rotate(-0.4); x.scale(1, 0.28); x.lineWidth = 9; x.strokeStyle = 'rgba(216,196,240,.78)'; x.beginPath(); x.arc(0, 0, 56, a0, a1); x.stroke(); x.lineWidth = 5; x.strokeStyle = 'rgba(180,160,220,.55)'; x.beginPath(); x.arc(0, 0, 47, a0, a1); x.stroke(); x.restore(); };
    ring(0, TAU);
    sphere(x, 60, 60, 33, [[0, '#ecd0ff'], [0.55, '#9a5ee0'], [1, '#34106a']], () => { for (let i = 0; i < 5; i++) ell(x, 60, 36 + i * 11, 40, 3, 'rgba(255,255,255,.18)'); });
    ring(0, Math.PI);
  });
  mk(sc, 'galaxy', 256, 256, (x) => {
    x.save(); x.translate(128, 128); x.rotate(-0.4); x.scale(1, 0.72); x.translate(-128, -128);
    const arms = ['170,200,255', '255,200,200', '255,255,170', '200,255,200'], r = rnd(77);
    glowDot(x, 128, 128, 110, '120,100,200', 0.25);
    x.globalCompositeOperation = 'lighter';
    for (let arm = 0; arm < 4; arm++) for (let i = 0; i < 360; i++) {
      const a = arm / 4 * TAU + i * 0.028, rad = 16 + i * 0.32, sp = (r() - 0.5) * (6 + i * 0.05);
      const px = 128 + Math.cos(a) * rad + Math.cos(a + Math.PI / 2) * sp, py = 128 + Math.sin(a) * rad + Math.sin(a + Math.PI / 2) * sp;
      if (i % 6 === 0) glowDot(x, px, py, 7, arms[arm], 0.07);
      disc(x, px, py, 0.5 + r() * 1.1, `rgba(${arms[arm]},${0.25 + (360 - i) / 360 * 0.6})`);
    }
    glowDot(x, 128, 128, 34, '255,250,220', 0.95); glowDot(x, 128, 128, 14, '255,255,255', 1);
    x.restore();
  });
}

// ============================================================================
// ИГРОВАЯ СЦЕНА
// ============================================================================
class GameScene extends Phaser.Scene {
  constructor() { super('game'); }

  txt(x, y, s, size, color, o) {
    o = o || {};
    const t = this.add.text(x, y, s, {
      fontFamily: FONT, fontSize: size + 'px', fontStyle: 'bold', color: color || '#fff',
      stroke: o.stroke || '#0a1626', strokeThickness: o.st == null ? 4 : o.st, align: o.align || 'left', resolution: o.res || D
    });
    const org = o.o || [0, 0]; t.setOrigin(org[0], org[1]); t.setDepth(o.depth || 100);
    return t;
  }

  create() {
    const W = this.W = LW, H = this.H = LH;
    sceneRef = this;
    const cam = this.cameras.main;
    cam.setZoom(D); cam.setScroll(-W * (D - 1) / 2, -H * (D - 1) / 2);
    cam.setBackgroundColor(CFG.LEVELS[1].color);
    buildTextures(this);

    Object.assign(this, {
      gs: 'playing', score: 0, shownScore: 0, scoreBump: 0, level: 1, lives: CFG.START_LIVES, dmg: 1, mult: 1,
      greenUntil: 0, invuln: false, bossActive: false, bossInv: false, boss: null,
      bullets: [], enemies: [], bonuses: [], bossBullets: [],
      t: 0, pulse: 0, warned: false, slowUntil: 0, pullUntil: 0, shownEnemies: {}, shownBosses: {}, sunTex: 'sun_normal',
      tx: W / 2, ty: H - 100, bossTrail: 0, orbit: null
    });

    this.buildBackground();
    this.buildFX();
    this.buildPlayer();
    this.buildHUD();

    // ---- управление (игнорируем клики по кнопкам звука и выхода) ----
    const move = (p) => {
      if (p.event && p.event.target && p.event.target.closest && p.event.target.closest('.gbtn, #dlg')) return;
      if (this.gs === 'playing') {
        this.tx = Phaser.Math.Clamp(p.x / D, 20, W - 20);
        this.ty = Phaser.Math.Clamp(p.y / D - 20, 20, H - 20);
      }
    };
    this.input.on('pointermove', move); this.input.on('pointerdown', move);

    // ---- таймеры ----
    this.fireTimer = this.time.addEvent({ delay: CFG.FIRE_MS, callback: this.fire, callbackScope: this, loop: true });
    this.spawnTimer = this.time.addEvent({ delay: CFG.SPAWN_MS, callback: () => { if (!this.bossActive && this.gs === 'playing') this.spawnEnemy(); }, loop: true });
    this.bossTimer = this.time.addEvent({ delay: CFG.BOSS_MS, callback: this.prepareBoss, callbackScope: this, loop: true });

    this.setLevelBG(1, true);
    Music.set('play', baseBpm(1));
  }

  // ------------------------------------------------------------------ BG
  buildBackground() {
    const W = this.W, H = this.H;
    this.bgA = this.add.image(W / 2, H / 2, 'bg1').setDisplaySize(W, H).setDepth(-20);
    this.bgB = this.add.image(W / 2, H / 2, 'bg1').setDisplaySize(W, H).setDepth(-19).setAlpha(0);
    this.horizon = this.add.image(W / 2, H * 1.02, 'glow').setDisplaySize(W * 2.6, W * 1.6).setBlendMode('ADD').setDepth(-18).setAlpha(0.25);
    this.starsA = this.add.tileSprite(W / 2, H / 2, W, H, 'stars1').setTileScale(1 / TS).setDepth(-17).setAlpha(0);
    this.starsB = this.add.tileSprite(W / 2, H / 2, W, H, 'stars2').setTileScale(1 / TS).setDepth(-16).setAlpha(0);
    this.bgClouds = [];
    for (let i = 0; i < 23; i++) {
      const far = i >= 15, c = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'cloud_bg');
      c.layer = far ? 0.55 : 1; c.setScale((far ? 1 : 2) / TS).setAlpha(far ? 0.12 : 0.2).setDepth(far ? -15 : -14);
      c.spd = 120 * Phaser.Math.FloatBetween(0.8, 1.2); this.bgClouds.push(c);
    }
    this.rain = this.add.particles(0, 0, 'rain', {
      x: { min: -20, max: W + 20 }, y: -30, lifespan: 1000, speedY: { min: 650, max: 850 }, speedX: -80,
      scale: 0.5, alpha: { start: 0.45, end: 0.2 }, rotate: 6, frequency: 22, quantity: 1, emitting: false
    }).setDepth(-13);
    this.vigRed = this.add.image(W / 2, H / 2, 'vig').setDisplaySize(W, H).setTint(0xff2020).setAlpha(0).setDepth(90);
    this.vigWarn = this.add.image(W / 2, H / 2, 'vig').setDisplaySize(W, H).setTint(0xff3030).setAlpha(0).setDepth(89);
    this.vigDark = this.add.image(W / 2, H / 2, 'vig').setDisplaySize(W, H).setTint(0x080014).setAlpha(0).setDepth(88);
  }

  setLevelBG(lv, instant) {
    const cfg = CFG.LEVELS[lv];
    this.cameras.main.setBackgroundColor(cfg.color);
    if (instant) this.bgA.setTexture('bg' + lv);
    else {
      this.bgB.setTexture('bg' + lv).setAlpha(0);
      this.tweens.add({ targets: this.bgB, alpha: 1, duration: 1200, onComplete: () => { this.bgA.setTexture('bg' + lv); this.bgB.setAlpha(0); } });
    }
    this.tweens.add({ targets: this.starsA, alpha: cfg.stars, duration: 1200 });
    this.tweens.add({ targets: this.starsB, alpha: cfg.stars * 0.8, duration: 1200 });
    this.horizon.setTint(cfg.glow[0]); this.tweens.add({ targets: this.horizon, alpha: cfg.glow[1], duration: 1200 });
    this.bgClouds.forEach((c) => c.setTint(cfg.cloudTint));
    if (lv === 2) this.rain.start(); else this.rain.stop();
  }

  updateBG(dt) {
    const k = Math.pow(CFG.SPEED_GROWTH, this.level - 1), W = this.W, H = this.H;
    for (const c of this.bgClouds) {
      c.y += c.spd * k * c.layer * dt;
      if (c.y > H + 60) { c.y = -60; c.x = Phaser.Math.Between(0, W); c.spd = 120 * Phaser.Math.FloatBetween(0.8, 1.2); }
    }
    this.starsA.tilePositionY -= 40 * k * dt * TS; this.starsB.tilePositionY -= 90 * k * dt * TS;
  }

  // ------------------------------------------------------------------ FX
  buildFX() {
    const E = (tex, c) => this.add.particles(0, 0, tex, Object.assign({ emitting: false }, c)).setDepth(25);
    const base = { speed: { min: 80, max: 240 }, scale: { start: 0.7, end: 0 }, alpha: { start: 1, end: 0 }, lifespan: { min: 300, max: 650 } };
    const sp = Object.assign({}, base, { scale: { start: 0.55, end: 0 }, lifespan: { min: 220, max: 480 }, blendMode: 'ADD', rotate: { min: 0, max: 360 } });
    this.fx = {
      puff: E('dot', Object.assign({}, base, { tint: 0xffffff, scale: { start: 0.9, end: 0 } })),
      boom: E('dot', Object.assign({}, base, { tint: 0xff9a2a, blendMode: 'ADD', scale: { start: 1, end: 0 } })),
      spark: E('spark', Object.assign({}, sp, { tint: 0xfff2a0 })),
      ice: E('spark', Object.assign({}, sp, { tint: 0x9ee8ff })),
      pink: E('dot', Object.assign({}, base, { tint: 0xff9ad8, blendMode: 'ADD' })),
      gold: E('spark', Object.assign({}, sp, { tint: 0xffd34a, speed: { min: 120, max: 380 }, gravityY: 220 })),
      green: E('spark', Object.assign({}, sp, { tint: 0x6dff7a })),
      red: E('dot', Object.assign({}, base, { tint: 0xff4a4a, blendMode: 'ADD' })),
      purple: E('spark', Object.assign({}, sp, { tint: 0xd45cff }))
    };
    this.trail = this.add.particles(0, 0, 'dot', {
      frequency: 45, lifespan: 420, speedY: { min: 25, max: 70 }, speedX: { min: -20, max: 20 },
      scale: { start: 0.45, end: 0 }, alpha: { start: 0.5, end: 0 }, tint: 0xffc933, blendMode: 'ADD'
    }).setDepth(3);
  }
  burst(name, x, y, n) { const e = this.fx[name]; if (e) e.explode(n, x, y); }
  ringFx(x, y, color, size) {
    const r = this.add.image(x, y, 'ring_fx').setTint(color).setBlendMode('ADD').setScale(0.2).setDepth(26);
    this.tweens.add({ targets: r, scale: size / (64 * TS), alpha: 0, duration: 420, ease: 'Sine.easeOut', onComplete: () => r.destroy() });
  }
  popText(x, y, str, o) {
    o = o || {};
    const t = this.txt(x, y, str, o.size || 20, o.color || '#fff', { o: [0.5, 0.5], st: o.st == null ? 4 : o.st, depth: 60 });
    t.setScale(0.4);
    this.tweens.add({ targets: t, scale: 1, duration: 140, ease: 'Back.out' });
    this.tweens.add({ targets: t, y: y - (o.rise || 36), alpha: 0, delay: o.hold || 180, duration: o.dur || 520, ease: 'Sine.easeIn', onComplete: () => t.destroy() });
  }
  banner(kind, name, color, yFrac) {
    const W = this.W, c = this.add.container(W / 2, this.H * (yFrac || 0.36)).setDepth(120);
    const g = this.add.graphics(); g.fillStyle(0x000000, 0.5); g.fillRect(-W / 2, -46, W, 92); g.fillStyle(color, 0.95); g.fillRect(-W / 2, -46, W, 2); g.fillRect(-W / 2, 44, W, 2);
    const t1 = this.txt(0, -22, kind, 14, hex(color), { o: [0.5, 0.5], st: 3 });
    const t2 = this.txt(0, 8, name, W < 340 ? 24 : 30, '#ffffff', { o: [0.5, 0.5], st: 5, stroke: hex(color) });
    c.add([g, t1, t2]); c.setScale(1, 0.1).setAlpha(0);
    this.tweens.add({ targets: c, scaleY: 1, alpha: 1, duration: 220, ease: 'Back.out' });
    this.tweens.add({ targets: c, alpha: 0, scaleY: 0.4, delay: 2000 - 380, duration: 380, onComplete: () => c.destroy() });
  }
  shake(ms, k) { this.cameras.main.shake(ms, k); }
  flashVig(img, a, ms) { img.setAlpha(a); this.tweens.add({ targets: img, alpha: 0, duration: ms }); }

  // ------------------------------------------------------------------ PLAYER
  buildPlayer() {
    const W = this.W, H = this.H;
    this.glow = this.add.image(W / 2, H - 100, 'glow').setTint(0xffc933).setBlendMode('ADD').setDepth(4);
    this.rays = this.add.image(W / 2, H - 100, 'sun_rays').setDepth(4.5);
    this.player = this.add.image(W / 2, H - 100, 'sun_normal').setDepth(5);
    this.pBase = 60 / (80 * TS);
    this.player.setScale(this.pBase);
    this.pupL = this.add.image(0, 0, 'pupil').setDepth(5.1);
    this.pupR = this.add.image(0, 0, 'pupil').setDepth(5.1);
    this.player.hw = 30; this.player.hh = 30;
  }
  setSunDepth(d) { this.glow.setDepth(d - 1); this.rays.setDepth(d - 0.5); this.player.setDepth(d); this.pupL.setDepth(d + 0.1); this.pupR.setDepth(d + 0.1); }
  layoutSun(dt) {
    const p = this.player; if (!p || !p.active) return;
    const u = p.scaleX * TS, pd = p.displayWidth;
    this.pulse = Math.max(0, this.pulse - dt * 6);
    this.rays.setPosition(p.x, p.y).setScale(p.scaleX * (1 + this.pulse * 0.12)).setAlpha(p.alpha); this.rays.rotation += dt * 0.9;
    this.glow.setPosition(p.x, p.y).setDisplaySize(pd * 2.1, pd * 2.1).setAlpha((0.42 + 0.1 * Math.sin(this.t * 4)) * p.alpha);
    let dx = 0, dy = -1, best = 1e9, tgt = null;
    for (const e of this.enemies) { const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2; if (d < best) { best = d; tgt = e; } }
    if (!tgt && this.boss) tgt = this.boss;
    if (tgt) { const vx = tgt.x - p.x, vy = tgt.y - p.y, l = Math.hypot(vx, vy) || 1; dx = vx / l; dy = vy / l; }
    const show = this.sunTex !== 'sun_hurt';
    this.pupL.setPosition(p.x + (33 - 40) * u + dx * 2.3 * u, p.y + (36 - 40) * u + dy * 2.3 * u).setDisplaySize(10 * u, 10 * u).setVisible(show).setAlpha(p.alpha);
    this.pupR.setPosition(p.x + (47 - 40) * u + dx * 2.3 * u, p.y + (36 - 40) * u + dy * 2.3 * u).setDisplaySize(10 * u, 10 * u).setVisible(show).setAlpha(p.alpha);
  }
  setSunTex(key) { this.sunTex = key; this.player.setTexture(key); }

  // ------------------------------------------------------------------ HUD (без фоновых плашек, с чётким контуром)
  buildHUD() {
    const W = this.W, hud = this.hudObjs = [];
    const LX = 12, RX = W - 12;
    const T_ = (x, y, s, size, col, o) => { const t = this.txt(x, y, s, size, col, o); hud.push(t); return t; };

    // Левый блок: Очки, Уровень, Жизни
    T_(LX, TOP + 6, 'ОЧКИ', 11, '#ffe9a8', { st: 3.5, o: [0, 0.5] });
    this.scoreTxt = T_(LX, TOP + 26, '0', 24, '#ffffff', { st: 4.5, o: [0, 0.5] });
    this.levelTxt = T_(LX, TOP + 48, 'УРОВЕНЬ 1', 12, '#ffff7a', { st: 3.5, o: [0, 0.5] });

    this.hearts = [];
    for (let i = 0; i < CFG.MAX_LIVES; i++) {
      const hx = LX + 10 + i * 22, hy = TOP + 69;
      const e = this.add.image(hx, hy, 'heart_empty').setDepth(100).setScale(21 / (28 * TS)); hud.push(e);
      const f = this.add.image(hx, hy, 'heart_full').setDepth(101).setScale(21 / (28 * TS)); f.setVisible(i < this.lives); hud.push(f);
      this.hearts.push(f);
    }

    // Правый блок: Урон, Пули, Тройной огонь
    this.dmgTxt = T_(RX, TOP + 10, 'УРОН 1', 13, '#ffa04a', { st: 3.5, o: [1, 0.5] });
    this.multTxt = T_(RX, TOP + 30, 'ПУЛИ ×1', 13, '#8fe8ff', { st: 3.5, o: [1, 0.5] });
    this.greenTxt = T_(RX, TOP + 50, 'ТРОЙНОЙ ОГОНЬ', 11, '#9bff9b', { st: 3.5, o: [1, 0.5] }).setVisible(false);

    // Верхний центр: Имя босса и полоска его ХП
    this.bossNameTxt = T_(W / 2, TOP + 8, '', 12, '#ffffff', { o: [0.5, 0.5], st: 4 }).setVisible(false);
    this.hudDyn = this.add.graphics().setDepth(101); hud.push(this.hudDyn);
  }
  updateLives() {
    this.hearts.forEach((h, i) => {
      const was = h.visible, now = i < this.lives;
      h.setVisible(now);
      if (now && !was) { h.setScale(0.01); this.tweens.add({ targets: h, scale: 21 / (28 * TS), duration: 380, ease: 'Back.out' }); }
      if (!now && was) { const gh = this.add.image(h.x, h.y, 'heart_full').setScale(h.scaleX).setDepth(102); this.tweens.add({ targets: gh, y: h.y - 22, alpha: 0, scale: h.scaleX * 1.6, duration: 450, onComplete: () => gh.destroy() }); }
    });
  }
  addScore(n) {
    this.score += n;
    this.scoreBump = 1;
  }
  updateHUD(dt) {
    if (this.shownScore < this.score) {
      this.shownScore = Math.min(this.score, this.shownScore + Math.max(1, Math.ceil((this.score - this.shownScore) * Math.min(1, dt * 8))));
      this.scoreTxt.setText(String(this.shownScore));
    }
    this.scoreBump = Math.max(0, this.scoreBump - dt * 4); this.scoreTxt.setScale(1 + this.scoreBump * 0.22);
    const g = this.hudDyn, W = this.W; g.clear();
    if (this.gs !== 'playing') { this.greenTxt.setVisible(false); this.bossNameTxt.setVisible(false); return; }

    // тонкий индикатор до появления босса на самом верху
    if (!this.bossActive && this.bossTimer) {
      const f = Phaser.Math.Clamp(1 - this.bossTimer.getRemaining() / CFG.BOSS_MS, 0, 1);
      g.fillStyle(0xffffff, 0.14); g.fillRect(0, SAFE_TOP, W, 3);
      g.fillStyle(this.warned ? 0xff4a4a : 0xb98cff, 0.95); g.fillRect(0, SAFE_TOP, W * f, 3);
    }

    // полоска таймера зелёного бонуса под надписью «ТРОЙНОЙ ОГОНЬ»
    const left = this.greenUntil - this.time.now;
    if (left > 0) {
      const gw = 88, gx = W - 12 - gw, gy = TOP + 61, gh = 6;
      g.fillStyle(0x0a1626, 0.75); g.fillRoundedRect(gx - 1, gy - 1, gw + 2, gh + 2, 4);
      g.fillStyle(0x46f05a, 0.95); g.fillRoundedRect(gx, gy, Math.max(4, gw * (left / CFG.GREEN_MS)), gh, 3);
      this.greenTxt.setVisible(true);
    } else this.greenTxt.setVisible(false);

    // имя босса и полоска ХП на самом верху по центру
    const b = this.boss;
    if (b) {
      const bw = Math.min(190, W - 164), bx = W / 2 - bw / 2, by = TOP + 20, bh = 10;
      this.bossNameTxt.setVisible(true).setText(CFG.LEVELS[this.level].boss.toUpperCase());
      this.bossTrail = Math.max(b.hp, this.bossTrail - b.maxHp * dt * 0.5);
      g.fillStyle(0x0a1626, 0.75); g.fillRoundedRect(bx - 2, by - 2, bw + 4, bh + 4, 6);
      g.fillStyle(0xffffff, 0.85); g.fillRoundedRect(bx, by, Math.max(0, bw * this.bossTrail / b.maxHp), bh, 4);
      const w = Math.max(0, bw * b.hp / b.maxHp);
      if (w > 1) {
        g.fillStyle(0xe01818, 1); g.fillRoundedRect(bx, by, w, bh, 4);
        g.fillStyle(0xff6a5a, 0.85); g.fillRoundedRect(bx, by, w, bh * 0.45, 4);
      }
      g.lineStyle(1.5, 0xffffff, 0.9); g.strokeRoundedRect(bx, by, bw, bh, 4);
    } else this.bossNameTxt.setVisible(false);
  }

  // ------------------------------------------------------------------ SPAWN / FIRE
  announceEnemy(kind, name) {
    if (this.shownEnemies[kind]) return; this.shownEnemies[kind] = true;
    this.banner('НОВЫЙ ВРАГ', name, 0xff4a4a, 0.36);
  }
  spawnEnemy() {
    const cfg = CFG.LEVELS[this.level]; if (!cfg || this.bossActive) return;
    const x = Phaser.Math.Between(40, this.W - 40);
    const e = this.add.image(x, -50, cfg.enemy).setScale(1 / TS).setDepth(1);
    const sz = CFG.SIZES[cfg.enemy];
    e.kind = cfg.enemy; e.hw = sz[0] / 2; e.hh = sz[1] / 2; e.ph = Math.random() * TAU;
    e.hp = cfg.enemyHp + Math.floor(this.level / 2);
    e.vy = cfg.speed * Math.pow(CFG.SPEED_GROWTH, this.level - 1) * Phaser.Math.FloatBetween(0.8, 1.2);
    if (this.level >= 2) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      const targetX = Phaser.Math.Clamp(e.x + dir * Phaser.Math.Between(50, 100), 40, this.W - 40);
      this.tweens.add({ targets: e, x: targetX, duration: 1000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    }
    this.enemies.push(e);
    this.announceEnemy(cfg.enemy, cfg.enemyName);
  }
  makeBullet(x, y, vx, vy, tex, isGreen) {
    const b = this.add.image(x, y, tex).setScale(1 / TS).setDepth(3);
    b.vx = vx; b.vy = vy; b.hw = 10; b.hh = 17.5; b.isGreen = !!isGreen; b.rotation = Math.atan2(vx, -vy);
    this.bullets.push(b);
  }
  fire() {
    if (this.gs !== 'playing') return;
    Aud.play('shoot');
    const p = this.player, green = this.time.now < this.greenUntil;
    this.pulse = 1;
    this.burst('spark', p.x, p.y - 26, 2);
    if (green) {
      const total = this.mult * 3, spread = CFG.GREEN_SPREAD, cx = total - 1;
      for (let i = 0; i < total; i++) {
        const a = ((i / cx) * spread - spread / 2) * Math.PI / 180;
        this.makeBullet(p.x, p.y - 20, Math.sin(a) * CFG.BULLET_SPEED, -Math.cos(a) * CFG.BULLET_SPEED, 'bullet_g', true);
      }
    } else {
      const total = this.mult, sx = p.x - ((total - 1) * CFG.BULLET_SPACING) / 2;
      for (let i = 0; i < total; i++) this.makeBullet(sx + i * CFG.BULLET_SPACING, p.y - 20, 0, -CFG.BULLET_SPEED, 'bullet', false);
    }
  }

  // ------------------------------------------------------------------ COMBAT
  flash(o) {
    if (o._flashing) return;
    o._flashing = true;
    o.setTintFill(0xffffff);
    this.time.delayedCall(35, () => {
      if (o.active) { o.clearTint(); o._flashing = false; }
    });
  }
  hitEnemy(e, b) {
    e.hp -= this.dmg;
    Aud.play('hit'); this.flash(e);
    this.popText(e.x + 20, e.y - 20, '-' + this.dmg, { size: 20, color: '#ff4040', st: 4, rise: 28, hold: 80, dur: 380 });
    this.burst('spark', b.x, b.y, 4);
    if (e.hp <= 0) this.killEnemy(e);
  }
  killEnemy(e) {
    Aud.play('enemy_death'); hap('impactOccurred', 'light');
    const fx = { cloud1: 'puff', cloud2: 'spark', cloud3: 'pink', crystal: 'ice', debris: 'boom' }[e.kind] || 'puff';
    this.burst(fx, e.x, e.y, 16); this.burst('puff', e.x, e.y, 5);
    this.ringFx(e.x, e.y, 0xffffff, 90);
    this.removeEnemy(e);
    if (Math.random() < CFG.DROP_CHANCE) {
      const t = Phaser.Math.Between(1, 4), key = t === 1 ? 'bonus_double' : t === 2 ? 'bonus_speed' : t === 3 ? 'bonus_damage' : 'bonus_heart';
      const bn = this.add.image(e.x, e.y + 20, key).setScale(1 / TS).setDepth(2);
      bn.ring = this.add.image(e.x, e.y + 20, 'bonus_ring').setScale(1 / TS).setDepth(1.9).setBlendMode('ADD');
      bn.kind = key; bn.hw = 25; bn.hh = 25; bn.vy = CFG.BONUS_FALL; bn.ph = Math.random() * TAU;
      this.bonuses.push(bn);
    }
    this.addScore(CFG.SCORE_KILL);
  }
  removeEnemy(e) {
    this.tweens.killTweensOf(e); e.destroy();
    const i = this.enemies.indexOf(e); if (i >= 0) this.enemies.splice(i, 1);
  }
  removeBonus(b) { if (b.ring) b.ring.destroy(); b.destroy(); const i = this.bonuses.indexOf(b); if (i >= 0) this.bonuses.splice(i, 1); }

  collectBonus(bn) {
    const p = this.player, k = bn.kind; let label = '', col = '#fff', sfx = '', fx = 'gold';
    if (k === 'bonus_double') { this.greenUntil = this.time.now + CFG.GREEN_MS; label = 'x3 ПУЛИ!'; col = '#7dff8a'; sfx = 'pow_green'; fx = 'green'; }
    else if (k === 'bonus_speed') { this.mult += 1; this.multTxt.setText('ПУЛИ ×' + this.mult); label = 'ПУЛИ +1!'; col = '#ffee55'; sfx = 'pow_yellow'; }
    else if (k === 'bonus_damage') { this.dmg += 1; this.dmgTxt.setText('УРОН ' + this.dmg); label = 'УРОН +1!'; col = '#ff77ff'; sfx = 'pow_purple'; fx = 'purple'; }
    else {
      if (this.lives < CFG.MAX_LIVES) { this.lives++; this.updateLives(); label = '+1 ЖИЗНЬ!'; sfx = 'pow_heart'; }
      else { this.addScore(CFG.SCORE_HEART_FULL); label = '+50 ОЧКОВ!'; sfx = 'pow_heart'; }
      col = '#ff6a6a'; fx = 'red';
    }
    Aud.play(sfx); hap('impactOccurred', 'medium');
    this.popText(p.x, p.y - 34, label, { size: 28, color: col, st: 6, rise: 40, hold: 250, dur: 520 });
    this.burst(fx, bn.x, bn.y, 18); this.ringFx(bn.x, bn.y, 0xffffff, 110);
    this.removeBonus(bn);
  }

  onPlayerHit(src) {
    if (this.invuln || this.gs !== 'playing') return;
    if (src) { this.burst('puff', src.x, src.y, 10); this.removeEnemy(src); }
    this.lives--; this.updateLives();
    Aud.play('hurt'); hap('notificationOccurred', 'error');
    this.shake(260, 0.014); this.flashVig(this.vigRed, 0.75, 500);
    this.burst('boom', this.player.x, this.player.y, 14);
    if (this.lives <= 0) { this.onGameOver(); return; }
    this.invuln = true; this.setSunTex('sun_hurt');
    this.tweens.add({
      targets: this.player, alpha: 0.2, duration: 100, yoyo: true, repeat: 10,
      onComplete: () => { this.player.alpha = 1; this.setSunTex('sun_normal'); this.invuln = false; }
    });
  }

  clearBossBullets() {
    this.bossBullets.forEach((b) => b.destroy());
    this.bossBullets = [];
    this.pullUntil = 0;
  }

  clearEntities() {
    this.bullets.forEach((b) => b.destroy()); this.bullets = [];
    this.enemies.forEach((e) => { this.tweens.killTweensOf(e); e.destroy(); }); this.enemies = [];
    this.bonuses.forEach((b) => { if (b.ring) b.ring.destroy(); b.destroy(); }); this.bonuses = [];
    this.clearBossBullets();
    this.destroyBoss();
  }
  destroyBoss() {
    if (this.boss) { this.boss.destroy(); this.boss = null; }
    if (this.bossAura) { this.bossAura.destroy(); this.bossAura = null; }
    if (this.bossEm) { this.bossEm.destroy(); this.bossEm = null; }
  }

  onGameOver() {
    this.gs = 'gameover';
    if (this.spawnTimer) this.spawnTimer.remove(); if (this.bossTimer) this.bossTimer.remove();
    this.clearEntities(); this.trail.stop(); this.rain.stop();
    Music.stop(); Aud.play('game_over');
    const W = this.W, H = this.H;
    this.player.alpha = 1;
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0).setDepth(110);
    this.tweens.add({ targets: dim, fillAlpha: 0.55, duration: 600 });
    const t = this.txt(W / 2, H / 2 - 20, 'GAME OVER', Math.min(60, W / 6.6), '#ff3030', { o: [0.5, 0.5], st: 7, depth: 111 });
    t.setScale(0.2).setAlpha(0); this.tweens.add({ targets: t, scale: 1, alpha: 1, duration: 500, ease: 'Back.out' });
    const s = this.txt(W / 2, H / 2 + 50, 'Счёт: ' + this.score, 30, '#ffffff', { o: [0.5, 0.5], st: 5, depth: 111 });
    s.setAlpha(0); this.tweens.add({ targets: s, alpha: 1, duration: 500, delay: 300 });
    this.time.delayedCall(2000, () => sendScoreAndClose());
  }

  // ------------------------------------------------------------------ BOSS & ATTACKS
  spawnBossProj(x, y, vx, vy, tex, opts) {
    if (this.gs !== 'playing' || !this.boss) return null;
    opts = opts || {};
    const pr = this.add.image(x, y, tex).setScale((opts.scale || 1) / TS).setDepth(3.8);
    pr.vx = vx; pr.vy = vy;
    pr.hw = opts.hw || 8.5; pr.hh = opts.hh || 8.5;
    pr.spin = opts.spin || 0;
    pr.sway = opts.sway || 0;
    pr.ph = opts.ph || 0;
    pr.splitY = opts.splitY || 0;
    if (opts.orient) pr.rotation = Math.atan2(vx, vy);
    this.bossBullets.push(pr);
    return pr;
  }

  bossAttack(bo) {
    if (!bo || !bo.active || this.gs !== 'playing') return;
    const lv = this.level, W = this.W, H = this.H, p = this.player;
    const bx = bo.x, by = bo.y + 24;
    const baseSpd = 195 + lv * 14;
    bo.atkStep = (bo.atkStep || 0) + 1;

    // Визуальная отдача босса при атаке
    const baseSc = 100 / (120 * TS);
    this.tweens.add({ targets: bo, scaleX: baseSc * 1.14, scaleY: baseSc * 0.9, duration: 130, yoyo: true, ease: 'Sine.easeOut' });
    Aud.play('boss_shot');

    if (lv === 1) {
      // 1. ВЗРЫВНОЙ УРАГАН: разрывная шаровая молния, распадающаяся в полёте на 5 искр
      this.ringFx(bx, by, 0xffe14a, 65);
      this.spawnBossProj(bx, by, 0, baseSpd * 0.85, 'bproj_bolt', {
        scale: 1.15, hw: 10, hh: 10, spin: 5, splitY: Math.min(H * 0.44, by + 135)
      });
    } else if (lv === 2) {
      // 2. ШТОРМОВОЙ ВИХРЬ: 3 вихревых сгустка с мягкой волнообразной траекторией
      this.ringFx(bx, by, 0x9fe8ff, 70);
      const count = 3, spread = 46 * Math.PI / 180;
      for (let i = 0; i < count; i++) {
        const a = (i / (count - 1) - 0.5) * spread;
        this.spawnBossProj(bx, by, Math.sin(a) * baseSpd, Math.cos(a) * baseSpd, 'bproj_wind', {
          spin: 7, sway: 55, ph: i * 1.4
        });
      }
    } else if (lv === 3) {
      // 3. ЗАТМЕНИЕ: лёгкая вспышка сумерек + веер огненной короны в сторону Солнца
      this.flashVig(this.vigDark, 0.38, 1200);
      this.ringFx(bx, by, 0xff8a2a, 80);
      const aim = Phaser.Math.Clamp(Math.atan2(p.x - bx, Math.max(90, p.y - by)), -0.45, 0.45);
      const count = bo.atkStep % 2 === 1 ? 3 : 4;
      const stepA = 25 * Math.PI / 180;
      for (let i = 0; i < count; i++) {
        const a = aim + (i - (count - 1) / 2) * stepA;
        this.spawnBossProj(bx, by, Math.sin(a) * baseSpd, Math.cos(a) * baseSpd, 'bproj_eclipse', { spin: 4 });
      }
    } else if (lv === 4) {
      // 4. ЛЕДЯНОЙ ГИГАНТ: чередует веер из 3 сосулек и «ледяной град» сверху с предупреждением
      this.ringFx(bx, by, 0x9fe8ff, 80);
      if (bo.atkStep % 2 === 1) {
        const aim = Phaser.Math.Clamp(Math.atan2(p.x - bx, Math.max(90, p.y - by)), -0.4, 0.4);
        for (let i = -1; i <= 1; i++) {
          const a = aim + i * 0.34;
          this.spawnBossProj(bx, by, Math.sin(a) * (baseSpd + 15), Math.cos(a) * (baseSpd + 15), 'bproj_ice', { orient: true });
        }
      } else {
        const shift = Phaser.Math.Between(-28, 28);
        [W * 0.22 + shift, W * 0.5 + shift * 0.5, W * 0.78 + shift].forEach((ix, idx) => {
          const cx = Phaser.Math.Clamp(ix, 36, W - 36);
          const warn = this.add.image(cx, TOP + 42, 'spark').setTint(0x9fe8ff).setScale(0.75 / TS).setDepth(30);
          this.tweens.add({
            targets: warn, scale: 1.35 / TS, alpha: 0, duration: 450, delay: idx * 90,
            onComplete: () => {
              warn.destroy();
              this.spawnBossProj(cx, TOP + 38, 0, baseSpd + 10, 'bproj_ice', { orient: true });
            }
          });
        });
      }
    } else if (lv === 5) {
      // 5. ЧЁРНАЯ ДЫРА: мягкий импульс притяжения + дуга из 4-5 сфер антиматерии
      const r = this.add.image(bo.x, bo.y, 'ring_fx').setTint(0xff55ff).setBlendMode('ADD').setScale(2.8 / TS).setAlpha(0.75).setDepth(3.7);
      this.tweens.add({ targets: r, scale: 0.3 / TS, alpha: 0, duration: 650, ease: 'Sine.easeIn', onComplete: () => r.destroy() });
      this.pullUntil = this.time.now + 1100;
      const count = bo.atkStep % 2 === 1 ? 4 : 5;
      const spread = 88 * Math.PI / 180;
      for (let i = 0; i < count; i++) {
        const a = (i / (count - 1) - 0.5) * spread;
        this.spawnBossProj(bx, by, Math.sin(a) * baseSpd, Math.cos(a) * baseSpd, 'bproj_void', { spin: 6 });
      }
    }
  }

  prepareBoss() {
    if (this.bossActive || this.gs !== 'playing' || this.level > 5) return;
    const lv = this.level, cfg = CFG.LEVELS[lv], W = this.W;
    if (this.bossTimer) this.bossTimer.paused = true;
    this.bossInv = true; this.time.delayedCall(CFG.BOSS_INTRO_MS, () => { this.bossInv = false; });
    this.bossActive = true; this.warned = false; this.vigWarn.setAlpha(0);
    const b = this.add.image(W / 2, -100, 'boss' + lv).setScale(100 / (120 * TS)).setDepth(4);

    // Вариант А: Адаптивное ХП от текущей раскачки игрока (dmg и mult)
    const effectiveVolley = this.dmg * (1 + (this.mult - 1) * 0.75);
    b.maxHp = Math.max(CFG.BOSS_MIN_HP[lv], Math.round(effectiveVolley * CFG.BOSS_VOLLEYS[lv]));
    b.hp = b.maxHp; b.hw = 42; b.hh = 42; b.born = this.time.now;
    b.nextAtk = this.time.now + CFG.BOSS_INTRO_MS + 800; b.atkStep = 0;

    this.boss = b; this.bossTrail = b.hp;
    this.bossAura = this.add.image(b.x, b.y, 'glow').setTint(cfg.bossTint).setBlendMode('ADD').setDepth(3.5).setAlpha(0.25);
    this.bossEm = this.add.particles(0, 0, 'dot', {
      frequency: 40, lifespan: 700, speed: { min: 20, max: 80 }, scale: { start: 0.5, end: 0 }, alpha: { start: 0.8, end: 0 },
      tint: cfg.bossTint, blendMode: 'ADD', emitZone: { type: 'random', source: new Phaser.Geom.Circle(0, 0, 44) }
    }).setDepth(3.6);
    if (!this.shownBosses[lv]) { this.shownBosses[lv] = true; this.banner('БОСС', cfg.boss, 0xff44ff, 0.42); }
    Aud.play('boss_appear'); Music.set('boss', baseBpm(lv) + 26);
    this.cameras.main.flash(300, 90, 0, 120); this.shake(500, 0.006);
  }
  hitBoss(b, bl) {
    const d = bl.isGreen ? Math.max(1, Math.round(this.dmg * 0.55)) : this.dmg;
    b.hp -= d;
    Aud.play('hit'); this.flash(b);
    this.popText(b.x + Phaser.Math.Between(-24, 28), b.y - 28, '-' + d, { size: 20, color: '#ff4040', st: 4, rise: 28, hold: 80, dur: 380 });
    this.burst('spark', bl.x, bl.y, 4);
    if (b.hp <= 0) this.killBoss();
  }
  killBoss() {
    const b = this.boss, bx = b.x, by = b.y;
    this.clearBossBullets();
    this.destroyBoss();
    for (let i = 0; i < 7; i++) this.time.delayedCall(i * 90, () => { const ox = bx + Phaser.Math.Between(-40, 40), oy = by + Phaser.Math.Between(-40, 40); this.burst('boom', ox, oy, 18); this.burst('spark', ox, oy, 10); this.ringFx(ox, oy, 0xffd34a, 140); });
    this.burst('gold', bx, by, 40);
    this.shake(500, 0.02); this.cameras.main.flash(250, 255, 255, 255);
    this.slowUntil = performance.now() + 380;
    this.popText(bx, by, '+' + CFG.SCORE_BOSS, { size: 40, color: '#ffe14a', st: 7, rise: 60, hold: 500, dur: 700 });
    hap('notificationOccurred', 'success');
    this.addScore(CFG.SCORE_BOSS);
    if (this.lives < CFG.MAX_LIVES) { this.lives++; this.updateLives(); }
    if (this.level < 5) {
      Aud.play('boss_win');
      this.level++; this.levelTxt.setText('УРОВЕНЬ ' + this.level);
      this.setLevelBG(this.level, false);
      this.bossActive = true;
      if (this.bossTimer) { this.bossTimer.remove(); this.bossTimer = null; }
      this.time.delayedCall(CFG.POST_BOSS_PAUSE_MS, () => {
        if (this.gs !== 'playing') return;
        this.bossActive = false;
        this.bossTimer = this.time.addEvent({ delay: CFG.BOSS_MS, callback: this.prepareBoss, callbackScope: this, loop: true });
      });
      Music.set('play', baseBpm(this.level));
      this.time.delayedCall(700, () => { if (this.gs === 'playing') this.popText(this.W / 2, this.H * 0.4, CFG.LEVELS[this.level].name.toUpperCase(), { size: 26, color: '#ffffff', st: 6, rise: 20, hold: 1500, dur: 600 }); });
    } else {
      this.bossActive = false;
      this.startEnding();
    }
  }

  // ------------------------------------------------------------------ UPDATE
  update(time, delta) {
    let dt = Math.min(delta, 50) / 1000;
    if (performance.now() < this.slowUntil) dt *= 0.3;
    this.t += dt;
    if (this.gs === 'playing' || this.gs === 'gameover') this.updateBG(dt);
    this.updateHUD(dt);
    this.layoutSun(dt);
    if (this.orbit) this.updateOrbit(dt);
    if (this.gs !== 'playing') return;
    const W = this.W, H = this.H, p = this.player;

    // мягкое притяжение Чёрной Дыры (только во время гравитационного импульса на 5 уровне)
    if (this.boss && this.time.now < this.pullUntil) {
      const dx = this.boss.x - p.x, dy = this.boss.y - p.y, len = Math.hypot(dx, dy) || 1;
      this.tx = Phaser.Math.Clamp(this.tx + (dx / len) * 32 * dt, 20, W - 20);
      this.ty = Phaser.Math.Clamp(this.ty + (dy / len) * 38 * dt, Math.max(260, TOP + 240), H - 20);
    }

    // игрок
    const k = 1 - Math.exp(-dt * 28);
    p.x += (this.tx - p.x) * k; p.y += (this.ty - p.y) * k;
    this.trail.setPosition(p.x, p.y + 12);

    // пули игрока
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -100 || b.x < -100 || b.x > W + 100) { b.destroy(); this.bullets.splice(i, 1); }
    }
    // враги
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i]; e.y += e.vy * dt; e.angle = Math.sin(this.t * 3 + e.ph) * 5;
      if (e.y > H + 50) { this.removeEnemy(e); continue; }
      if (!this.invuln && ov(p, e)) { this.onPlayerHit(e); if (this.gs !== 'playing') return; }
    }
    // снаряды боссов
    for (let i = this.bossBullets.length - 1; i >= 0; i--) {
      const bb = this.bossBullets[i];
      bb.x += bb.vx * dt; bb.y += bb.vy * dt;
      if (bb.sway) bb.x += Math.sin(this.t * 5.5 + bb.ph) * bb.sway * dt;
      if (bb.spin) bb.rotation += bb.spin * dt;
      // разрыв шаровой молнии 1-го босса
      if (bb.splitY && bb.y >= bb.splitY) {
        const sx = bb.x, sy = bb.y;
        bb.destroy(); this.bossBullets.splice(i, 1);
        this.ringFx(sx, sy, 0xffe14a, 75); this.burst('spark', sx, sy, 10); Aud.play('hit');
        for (let k = -2; k <= 2; k++) {
          const a = k * 0.44;
          this.spawnBossProj(sx, sy, Math.sin(a) * 195, Math.cos(a) * 195, 'bproj_spark', { hw: 7, hh: 7, spin: 6 });
        }
        continue;
      }
      if (bb.y > H + 60 || bb.y < -80 || bb.x < -60 || bb.x > W + 60) {
        bb.destroy(); this.bossBullets.splice(i, 1); continue;
      }
      if (!this.invuln && ov(p, bb)) {
        this.burst('spark', bb.x, bb.y, 8);
        bb.destroy(); this.bossBullets.splice(i, 1);
        this.onPlayerHit(null);
        if (this.gs !== 'playing') return;
      }
    }
    // пули ↔ враги и босс
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i]; let used = false;
      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const e = this.enemies[j];
        if (ov(b, e)) { b.destroy(); this.bullets.splice(i, 1); this.hitEnemy(e, b); used = true; break; }
      }
      if (used) continue;
      const bo = this.boss;
      if (bo && !this.bossInv && ov(b, bo)) { b.destroy(); this.bullets.splice(i, 1); this.hitBoss(bo, b); if (!this.boss) break; }
    }
    // бонусы
    for (let i = this.bonuses.length - 1; i >= 0; i--) {
      const b = this.bonuses[i]; b.y += b.vy * dt; b.angle = Math.sin(this.t * 5 + b.ph) * 8;
      b.ring.setPosition(b.x, b.y).setScale((1 + 0.12 * Math.sin(this.t * 6 + b.ph)) / TS).setAlpha(0.6 + 0.3 * Math.sin(this.t * 6 + b.ph));
      if (b.y > H + 50) { this.removeBonus(b); continue; }
      if (ov(p, b)) this.collectBonus(b);
    }
    // босс (траектория ниже шапки HUD + периодические атаки)
    const bo = this.boss;
    if (bo) {
      const now = this.time.now, kk = Math.min(1, (now - bo.born) / CFG.BOSS_INTRO_MS), L = this.level;
      const maxX = Math.max(40, W / 2 - 55);
      bo.x = W / 2 + Math.sin(now / 500) * Math.min(60 + L * 12, maxX);
      const targetY = (TOP + 175) + Math.cos(now / 800) * (25 + L * 4);
      bo.y = Phaser.Math.Linear(-100, targetY, Phaser.Math.Easing.Back.Out(kk));
      bo.alpha = this.bossInv ? 0.5 + Math.sin(Date.now() / 100) * 0.5 : 1;
      this.bossAura.setPosition(bo.x, bo.y).setDisplaySize(210 + 18 * Math.sin(this.t * 3), 210 + 18 * Math.sin(this.t * 3)).setAlpha(0.25 * bo.alpha);
      this.bossEm.setPosition(bo.x, bo.y);
      if (!this.bossInv && now >= bo.nextAtk) {
        this.bossAttack(bo);
        bo.nextAtk = now + (2400 - L * 90);
      }
      if (!this.bossInv && !this.invuln && ov(p, bo)) this.onPlayerHit(null);
    }
    // предупреждение о боссе
    if (!this.bossActive && this.bossTimer && this.level <= 5) {
      if (!this.warned && this.bossTimer.getRemaining() < 3000) { this.warned = true; Aud.play('warn'); Music.bpm += 14; }
      this.vigWarn.setAlpha(this.warned ? 0.16 + 0.14 * Math.sin(this.t * 9) : 0);
    }
  }

  // ------------------------------------------------------------------ ENDING
  startEnding() {
    this.gs = 'ending';
    if (this.spawnTimer) this.spawnTimer.remove(); if (this.bossTimer) this.bossTimer.remove();
    this.clearEntities(); this.trail.stop(); this.rain.stop(); this.vigWarn.setAlpha(0); this.vigDark.setAlpha(0);
    Aud.play('boss5_win'); Music.set('dark', 72);
    this.setSunTex('sun_happy'); this.player.alpha = 1;
    const W = this.W, H = this.H;
    this.tweens.add({
      targets: this.player, x: W / 2, y: H / 2, scaleX: 180 / (80 * TS), scaleY: 180 / (80 * TS), duration: 2000, ease: 'Sine.easeInOut',
      onComplete: () => this.showSpaceScene()
    });
    this.hudObjs.forEach((o) => o.setVisible(false));
    this.bossNameTxt.setVisible(false);
  }
  updateOrbit(dt) {
    const W = this.W, H = this.H;
    this.orbit.forEach((o) => {
      o.a += o.w * dt;
      const x = W / 2 + Math.cos(o.a) * o.rx, y = H / 2 + Math.sin(o.a) * o.ry, front = Math.sin(o.a) > 0;
      o.img.setPosition(x, y).setDepth(front ? 15 : 5).setScale(o.s * (front ? 1.08 : 0.92)); o.img.rotation += dt * 0.3;
    });
    this.player.x = W / 2; this.player.y = H / 2;
  }
  showSpaceScene() {
    const W = this.W, H = this.H, cam = this.cameras.main;
    cam.setBackgroundColor('#000000');
    this.bgA.setVisible(false); this.bgB.setVisible(false); this.horizon.setVisible(false); this.bgClouds.forEach((c) => c.setVisible(false)); this.vigRed.setVisible(false);
    this.starsA.setAlpha(0); this.starsB.setAlpha(0);
    this.spaceNear = this.add.tileSprite(W / 2, H / 2, W * 2, H * 2, 'stars1').setTileScale(1 / TS).setDepth(-30);
    this.spaceNear2 = this.add.tileSprite(W / 2, H / 2, W * 2, H * 2, 'stars2').setTileScale(1 / TS).setDepth(-29);
    this.spaceFar = this.add.tileSprite(W / 2, H / 2, W * 14, H * 14, 'stars2').setTileScale(7 / TS).setDepth(-31).setAlpha(0);
    this.tweens.add({ targets: this.spaceNear2, alpha: 0.4, duration: 1200, yoyo: true, repeat: -1 });
    this.player.setPosition(W / 2, H / 2); this.setSunDepth(10);
    const texs = ['planet1', 'planet2', 'planet3', 'planet4', 'planet5'];
    this.orbit = texs.map((tk, i) => {
      const size = 56 - i * 5, rx = 118 + i * 15, img = this.add.image(W / 2, H / 2, tk);
      return { img, a: i / 5 * TAU, w: (0.85 - i * 0.12), rx: Math.min(rx, W / 2 - 24 - size / 2 + 20), ry: rx * 1.55, s: (size * (tk === 'planet5' ? 1.35 : 1)) / (120 * TS) };
    });
    this.time.delayedCall(4000, () => {
      cam.zoomTo(D * 0.1, 6000);
      const galaxy = this.add.image(W / 2, H / 2, 'galaxy').setDisplaySize(2000, 2000).setDepth(0).setAlpha(0);
      this.tweens.add({ targets: galaxy, alpha: 1, duration: 2500 });
      this.tweens.add({ targets: galaxy, angle: 25, duration: 22000 });
      this.tweens.add({ targets: this.spaceNear, alpha: 0, duration: 5000 });
      this.tweens.add({ targets: this.spaceFar, alpha: 1, duration: 5000 });
      this.time.delayedCall(6000, () => {
        Aud.play('evil_triumph');
        const bhGlow = this.add.image(W * 5, H / 2, 'glow').setTint(0xcc00cc).setBlendMode('ADD').setDisplaySize(3400, 3400).setDepth(99).setAlpha(0.7);
        const bh = this.add.image(W * 5, H / 2, 'final_blackhole').setDisplaySize(2000, 2000).setDepth(100);
        this.tweens.add({ targets: [bh, bhGlow], x: W / 2, duration: 5000, ease: 'Power2' });
        this.tweens.add({ targets: bhGlow, alpha: 0.4, yoyo: true, repeat: -1, duration: 700 });
        cam.shake(5000, 0.003);
        this.time.delayedCall(5500, () => {
          const fs = Math.round(W * 1.0);
          const fin = this.add.text(W / 2, H / 2 + 1250, 'ПРОДОЛЖЕНИЕ\nСЛЕДУЕТ...', {
            fontFamily: FONT, fontSize: fs + 'px', fontStyle: 'bold', color: '#ffffff', stroke: '#ff00ff', strokeThickness: Math.round(fs * 0.06), align: 'center', resolution: 1
          }).setOrigin(0.5).setDepth(102).setAlpha(0);
          this.tweens.add({ targets: fin, alpha: 1, duration: 500 });
          this.time.delayedCall(1000, () => { sendScoreAndClose(); });
        });
      });
    });
  }
}

// ============================================================================
// ЗАПУСК
// ============================================================================
const game = new Phaser.Game({
  type: Phaser.AUTO,
  width: Math.round(LW * D), height: Math.round(LH * D),
  parent: 'game-container', backgroundColor: '#4ea1d3',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  render: { antialias: true, powerPreference: 'high-performance' },
  disableContextMenu: true,
  scene: [GameScene]
});

// ---------- DOM: звук, выход ----------
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const btnMute = document.getElementById('btnMute');
const setIcon = () => { btnMute.innerHTML = Aud.muted ? ICON_OFF : ICON_ON; };
setIcon();
btnMute.addEventListener('click', () => { Aud.init(); Aud.setMuted(!Aud.muted); setIcon(); if (Aud.ctx && Aud.ctx.state === 'suspended') Aud.ctx.resume(); Music.kick(); });

const dlg = document.getElementById('dlg');
const scn = () => game.scene.getScene('game');
document.getElementById('btnExit').addEventListener('click', () => {
  const s = scn();
  if (!s || s.gs !== 'playing') { sendScoreAndClose(); return; }
  s.scene.pause(); dlg.classList.add('show');
});
document.getElementById('dlgNo').addEventListener('click', () => { dlg.classList.remove('show'); const s = scn(); if (s) s.scene.resume(); });
document.getElementById('dlgYes').addEventListener('click', () => { dlg.classList.remove('show'); sendScoreAndClose(); });

// ---------- аудио стартует по первому касанию ----------
const unlock = () => {
  Aud.init();
  if (Aud.ctx && Aud.ctx.state === 'suspended') Aud.ctx.resume().then(() => Music.kick()).catch(() => {});
  else Music.kick();
};
['pointerdown', 'touchend', 'mousedown', 'click', 'keydown'].forEach((ev) => window.addEventListener(ev, unlock, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (!Aud.ctx) return;
  if (document.hidden) Aud.ctx.suspend(); else Aud.ctx.resume();
});

})();
</script>
