<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunny Strike</title>
    <!-- ВСТАВЬ СКЛЕЕННЫЕ ССЫЛКИ СЮДА -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #4ea1d3; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>

    // ... (в функции preload добавь текстуру для Босса 3) ...
g.fillStyle(0xffa500).fillTriangle(0, 50, 100, 50, 50, 0); // Оранжевый треугольник-птица
g.generateTexture('boss3', 100, 50); g.clear();

// ... (в функции spawn обнови логику уровней) ...
function spawn() {
    if (isBossActive) return;

    // УРОВЕНЬ 3: Стратосфера (Закат) - после 1200 очков
    if (score >= 1200 && bossSpawned === 2) {
        level = 3;
        levelText.setText('Уровень: 3 (Закат)');
        this.cameras.main.setBackgroundColor('#6a4c93'); // Фиолетовое небо
    }

    // Появление Босса №3 на 1600 очках
    if (score >= 1600 && bossSpawned === 2) {
        spawnBoss3.call(this);
        return;
    }

    // Обычный спавн
    let x = Phaser.Math.Between(40, config.width - 40);
    let type = (level === 3) ? 'cloud2' : (level === 2 ? 'cloud2' : 'cloud1');
    let c = clouds.create(x, -50, type);
    c.hp = (level >= 2) ? 2 : 1;
    c.setVelocityY(250 + (level * 30)); // Ускоряем врагов
}

// ЭФФЕКТ ВЕТРА НА УРОВНЕ 3
function update() {
    bullets.children.iterate(b => { 
        if (b && b.y < -20) b.destroy();
        // На 3 уровне ветер сносит пули вправо
        if (level === 3 && b) b.x += 1.5; 
    });

    if (isBossActive && boss && boss.active) {
        bossBar.clear(); bossBar.fillStyle(0xff0000);
        bossBar.fillRect(config.width/2 - 50, 50, (boss.hp/boss.maxHp) * 100, 10);
        
        // Поведение Босса 3: мечется по горизонтали
        if (bossSpawned === 3) {
            boss.x = (config.width / 2) + Math.sin(this.time.now / 300) * 100;
        }
    }
}

// БОСС №3: Король Стриж
function spawnBoss3() {
    isBossActive = true;
    bossSpawned = 3;
    levelText.setText('БОСС: КОРОЛЬ СТРИЖ');
    
    boss = this.physics.add.sprite(config.width / 2, -100, 'boss3');
    boss.maxHp = 70; boss.hp = 70;
    
    this.tweens.add({ targets: boss, y: 150, duration: 1500, ease: 'Cubic.easeOut' });

    // Механика Стрижа: он хлопает крыльями (звук и толчок игрока)
    this.time.addEvent({
        delay: 3000,
        callback: () => {
            if (isBossActive && boss.active) {
                playSound(50, 'sawtooth', 0.5, 0.3); // Гул ветра
                this.cameras.main.shake(200, 0.01);
                // Порыв ветра сносит игрока к краю
                this.tweens.add({ targets: player, x: player.x > config.width/2 ? 50 : config.width-50, duration: 1000 });
            }
        },
        loop: true
    });

    this.physics.add.overlap(bullets, boss, (bObj, bullet) => {
        bullet.destroy(); bObj.hp--; 
        playSound(200, 'square', 0.05);
        if (bObj.hp <= 0) {
            bObj.destroy(); isBossActive = false; score += 2000;
            levelText.setText('Уровень 3 ПРОЙДЕН! Выходим в космос...');
            this.cameras.main.setBackgroundColor('#1a1a2e'); // Темнеет перед 4 уровнем
        }
    });
}

    
    
    </script>
</body>
</html>
